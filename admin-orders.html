<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saint Leo's Mart — View Orders</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #100b08;
      color: #f2eadb;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    .header {
      padding: 22px 30px;
      border-bottom: 1px solid #493722;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      color: #d4aa60;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 { font-size: 24px; margin-top: 6px; }

    .container {
      width: min(1200px, 94%);
      margin: 30px auto 80px;
    }

    .back-link {
      display: inline-block;
      color: #d4aa60;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .intro {
      color: #b9ad9b;
      font-size: 13px;
      line-height: 1.7;
      margin: 8px 0 22px;
    }

    .button {
      border: 1px solid #b98a3b;
      background: transparent;
      color: #f2eadb;
      padding: 10px 15px;
      border-radius: 6px;
    }

    .button:hover {
      background: #b98a3b;
      color: #100b08;
    }

    .danger-button {
      border: 1px solid #df8585;
      background: transparent;
      color: #df8585;
      padding: 10px 14px;
      border-radius: 5px;
    }

    .danger-button:hover {
      background: #df8585;
      color: #100b08;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat, .order-card {
      border: 1px solid #493722;
      background: rgba(255,255,255,.035);
      border-radius: 9px;
      padding: 20px;
    }

    .stat-label {
      font-size: 11px;
      letter-spacing: 1px;
      color: #b9ad9b;
    }

    .stat-number {
      display: block;
      color: #d4aa60;
      font-size: 30px;
      margin-top: 9px;
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .filters input, .filters select,
    .order-card select, .order-card textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #59452c;
      border-radius: 6px;
      background: #17110d;
      color: #f2eadb;
      outline: none;
    }

    .filters input:focus, .filters select:focus,
    .order-card select:focus, .order-card textarea:focus {
      border-color: #d4aa60;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .message {
      padding: 20px;
      text-align: center;
      border: 1px dashed #493722;
      border-radius: 8px;
      color: #b9ad9b;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .orders-list { display: grid; gap: 14px; }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .order-card h3 {
      color: #e8c786;
      font-size: 17px;
      margin: 10px 0 6px;
    }

    .brand-name {
      color: #d4aa60;
      font-weight: 700;
      font-size: 13px;
      margin-top: 7px;
    }

    .muted {
      color: #b9ad9b;
      font-size: 12px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #34291a;
      color: #e5bd70;
    }

    .status-confirmed, .status-completed {
      background: #183321;
      color: #8dd49a;
    }

    .status-cancelled, .status-unconfirmed,
    .status-not_received {
      background: #3b2020;
      color: #ed9999;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .detail {
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .detail strong { color: #d4aa60; }

    .items {
      margin-top: 7px;
      display: grid;
      gap: 5px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .control-label {
      display: block;
      color: #b9ad9b;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .order-card textarea {
      min-height: 75px;
      resize: vertical;
      margin-top: 12px;
    }

    .actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .access-message {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      line-height: 1.7;
    }

    @media (max-width: 750px) {
      .header { padding: 18px 15px; }
      h1 { font-size: 20px; }
      .container { width: 92%; margin-top: 22px; }
      .stats { grid-template-columns: 1fr; }
      .filters { grid-template-columns: 1fr; }
      .grid, .controls { grid-template-columns: 1fr; }
      .stat { padding: 17px; }
    }
  </style>
</head>

<body>

  <div id="accessMessage" class="access-message">
    Checking admin access...
  </div>

  <div id="ordersApp" class="hidden">

    <header class="header">
      <div>
        <div class="brand">SAINT LEO'S MART</div>
        <h1>Brand Orders</h1>
      </div>

      <button class="button" onclick="adminLogout()">LOG OUT</button>
    </header>

    <main class="container">

      <a href="admin.html" class="back-link">← BACK TO ADMIN DASHBOARD</a>

      <div class="toolbar">
        <div>
          <h2>View Orders</h2>
          <p class="intro">
            Manage orders submitted through the brands on Saint Leo's Mart.
          </p>
        </div>

        <button class="button" onclick="loadBrandOrders()">
          REFRESH ORDERS
        </button>
      </div>

      <section class="stats">
        <div class="stat">
          <span class="stat-label">TOTAL ORDERS</span>
          <strong class="stat-number" id="ordersTotal">0</strong>
        </div>

        <div class="stat">
          <span class="stat-label">AWAITING VENDOR</span>
          <strong class="stat-number" id="ordersAwaiting">0</strong>
        </div>

        <div class="stat">
          <span class="stat-label">OVERDUE / UNCONFIRMED</span>
          <strong class="stat-number" id="ordersOverdue">0</strong>
        </div>
      </section>

      <section class="filters">
        <input
          id="orderSearch"
          placeholder="Search reference, customer, phone..."
          oninput="renderBrandOrders()"
        >

        <select id="orderBrandFilter" onchange="renderBrandOrders()">
          <option value="">All brands</option>
        </select>

        <select id="orderStatusFilter" onchange="renderBrandOrders()">
          <option value="">All statuses</option>
          <option value="awaiting_confirmation">Awaiting confirmation</option>
          <option value="confirmed">Confirmed</option>
          <option value="not_received">Not received</option>
          <option value="processing">Processing</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="unconfirmed">Unconfirmed</option>
        </select>

        <select id="orderPaymentFilter" onchange="renderBrandOrders()">
          <option value="">All payment statuses</option>
          <option value="payment_pending">Payment pending</option>
          <option value="not_paid">Not paid</option>
          <option value="paid">Paid</option>
        </select>
      </section>

      <div id="ordersMessage" class="message">
        Loading orders...
      </div>

      <div id="ordersList" class="orders-list"></div>

    </main>
  </div>

  <script>
    "use strict";

    const ORDER_STATUSES = [
      "awaiting_confirmation",
      "confirmed",
      "not_received",
      "processing",
      "completed",
      "cancelled",
      "unconfirmed"
    ];

    const PAYMENT_STATUSES = [
      "payment_pending",
      "not_paid",
      "paid"
    ];

    let cachedOrders = [];
    let cachedBrands = [];
    let brandMap = new Map();

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function niceStatus(value) {
      return String(value || "")
        .replaceAll("_", " ")
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    function formatDate(value) {
      if (!value) return "—";

      const date = new Date(value);

      return Number.isNaN(date.getTime())
        ? "—"
        : date.toLocaleString("en-NG", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });
    }

    function money(value) {
      const number = Number(value);

      return Number.isFinite(number)
        ? "₦" + number.toLocaleString("en-NG", {
            maximumFractionDigits: 2
          })
        : "Not specified";
    }

    function showMessage(message) {
      document.getElementById("ordersMessage").textContent = message;
    }

    async function checkAdminAccess() {
      const accessMessage = document.getElementById("accessMessage");
      const app = document.getElementById("ordersApp");

      try {
        const {
          data: { session },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
          window.location.href = "account.html";
          return;
        }

        const { data, error } = await supabaseClient
          .from("admin_users")
          .select("user_id")
          .eq("user_id", session.user.id)
          .maybeSingle();

        if (error || !data) {
          accessMessage.innerHTML = `
            <div>
              <h2>Access Denied</h2>
              <p>You do not have permission to access this page.</p>
              <a href="index.html" class="back-link">BACK TO SHOP</a>
            </div>
          `;
          return;
        }

        accessMessage.classList.add("hidden");
        app.classList.remove("hidden");

        await loadBrandOrders();

      } catch (error) {
        console.error("Admin access error:", error);
        accessMessage.textContent =
          "Could not verify admin access. Please refresh or sign in again.";
      }
    }

    async function loadBrandOrders() {
      showMessage("Loading orders...");
      document.getElementById("ordersList").innerHTML = "";

      try {
        const [brandsResult, ordersResult] = await Promise.all([
          supabaseClient
            .from("brands")
            .select("id, name")
            .order("name"),

          supabaseClient
            .from("brand_orders")
            .select(`
              id, order_number, brand_id, customer_name, customer_phone,
              delivery_address, items_total, delivery_fee, total_amount,
              request_type, request_details, order_status, payment_status,
              cancellation_reason, vendor_note, checkout_initiated_at,
              vendor_response_at, created_at, updated_at
            `)
            .order("created_at", { ascending: false })
            .limit(500)
        ]);

        if (brandsResult.error) throw brandsResult.error;
        if (ordersResult.error) throw ordersResult.error;

        cachedBrands = brandsResult.data || [];
        cachedOrders = ordersResult.data || [];

        // Use a map so brand IDs are matched consistently.
        brandMap = new Map(
          cachedBrands.map(brand => [
            String(brand.id).toLowerCase(),
            brand.name
          ])
        );

        if (cachedOrders.length) {
          const orderIds = cachedOrders.map(order => order.id);

          const { data: items, error: itemError } = await supabaseClient
            .from("brand_order_items")
            .select("id, order_id, product_name, quantity, unit_price, line_total")
            .in("order_id", orderIds);

          if (itemError) {
            console.warn("Could not load order items:", itemError.message);
          }

          const itemMap = new Map();

          (items || []).forEach(item => {
            if (!itemMap.has(item.order_id)) {
              itemMap.set(item.order_id, []);
            }

            itemMap.get(item.order_id).push(item);
          });

          cachedOrders.forEach(order => {
            order.items = itemMap.get(order.id) || [];
          });
        }

        populateBrandFilter();
        updateOrderStats();
        renderBrandOrders();

      } catch (error) {
        console.error("Order loading error:", error);
        showMessage(
          "Could not load orders. Check your database access policies and table columns."
        );
      }
    }

    function getBrandName(order) {
      return brandMap.get(String(order.brand_id || "").toLowerCase())
        || "Unknown brand";
    }

    function populateBrandFilter() {
      const select = document.getElementById("orderBrandFilter");
      const previous = select.value;

      select.innerHTML = '<option value="">All brands</option>';

      cachedBrands.forEach(brand => {
        const option = document.createElement("option");
        option.value = brand.id;
        option.textContent = brand.name;
        select.appendChild(option);
      });

      if ([...select.options].some(option => option.value === previous)) {
        select.value = previous;
      }
    }

    function updateOrderStats() {
      const awaiting = cachedOrders.filter(order =>
        order.order_status === "awaiting_confirmation"
      ).length;

      const overdue = cachedOrders.filter(order =>
        ["unconfirmed", "not_received"].includes(order.order_status) ||
        (
          order.order_status === "awaiting_confirmation" &&
          Date.now() - new Date(order.created_at).getTime() >=
            48 * 60 * 60 * 1000
        )
      ).length;

      document.getElementById("ordersTotal").textContent =
        cachedOrders.length;

      document.getElementById("ordersAwaiting").textContent = awaiting;
      document.getElementById("ordersOverdue").textContent = overdue;
    }

    function renderBrandOrders() {
      const search = document.getElementById("orderSearch")
        .value.trim().toLowerCase();

      const brandFilter =
        document.getElementById("orderBrandFilter").value;

      const statusFilter =
        document.getElementById("orderStatusFilter").value;

      const paymentFilter =
        document.getElementById("orderPaymentFilter").value;

      const list = document.getElementById("ordersList");
      list.innerHTML = "";

      const filtered = cachedOrders.filter(order => {
        const brandName = getBrandName(order);

        const haystack = [
          order.order_number,
          order.customer_name,
          order.customer_phone,
          brandName,
          order.request_details,
          order.vendor_note
        ].join(" ").toLowerCase();

        return (
          (!search || haystack.includes(search)) &&
          (!brandFilter || String(order.brand_id) === brandFilter) &&
          (!statusFilter || order.order_status === statusFilter) &&
          (!paymentFilter || order.payment_status === paymentFilter)
        );
      });

      if (!filtered.length) {
        showMessage(
          cachedOrders.length
            ? "No orders match your filters."
            : "No brand orders have been recorded yet."
        );
        return;
      }

      showMessage(`${filtered.length} order(s) shown.`);

      filtered.forEach(order => {
        const card = document.createElement("article");
        card.className = "order-card";

        const itemsHtml = order.items?.length
          ? order.items.map(item => `
              <div class="detail">
                ${escapeHtml(item.product_name)}
                — Qty ${escapeHtml(item.quantity)}
                — ${money(item.line_total)}
              </div>
            `).join("")
          : `<div class="detail">No itemised products recorded.</div>`;

        card.innerHTML = `
          <div class="order-top">
            <div>
              <span class="badge status-${escapeHtml(order.order_status)}">
                ${escapeHtml(niceStatus(order.order_status))}
              </span>

              <h3>${escapeHtml(order.order_number || "Order")}</h3>

              <div class="brand-name">
                BRAND: ${escapeHtml(getBrandName(order))}
              </div>

              <div class="muted">
                ${escapeHtml(niceStatus(order.request_type || "order"))}
              </div>
            </div>

            <div class="muted">
              Created: ${escapeHtml(formatDate(order.created_at))}
            </div>
          </div>

          <div class="grid">
            <div class="detail">
              <strong>Customer</strong><br>
              ${escapeHtml(order.customer_name)}
            </div>

            <div class="detail">
              <strong>Phone</strong><br>
              <a style="color:#e8c786"
                 href="tel:${escapeHtml(order.customer_phone)}">
                ${escapeHtml(order.customer_phone)}
              </a>
            </div>

            <div class="detail">
              <strong>Delivery address</strong><br>
              ${escapeHtml(order.delivery_address || "Not supplied")}
            </div>

            <div class="detail">
              <strong>Vendor response</strong><br>
              ${escapeHtml(formatDate(order.vendor_response_at))}
            </div>
          </div>

          <div style="margin-top:16px">
            <div class="detail"><strong>Customer request</strong></div>
            <div class="detail" style="white-space:pre-wrap;margin-top:6px">
              ${escapeHtml(order.request_details || "No request details recorded.")}
            </div>
          </div>

          <div style="margin-top:16px">
            <div class="detail"><strong>Recorded items</strong></div>
            <div class="items">${itemsHtml}</div>
          </div>

          <div class="grid">
            <div class="detail">
              <strong>Items total</strong><br>
              ${money(order.items_total)}
            </div>

            <div class="detail">
              <strong>Delivery fee</strong><br>
              ${money(order.delivery_fee)}
            </div>

            <div class="detail">
              <strong>Total</strong><br>
              ${money(order.total_amount)}
            </div>

            <div class="detail">
              <strong>Payment status</strong><br>
              ${escapeHtml(niceStatus(order.payment_status))}
            </div>
          </div>

          <div class="controls">
            <label>
              <span class="control-label">Order status</span>
              <select id="status-${escapeHtml(order.id)}">
                ${ORDER_STATUSES.map(status => `
                  <option value="${status}"
                    ${order.order_status === status ? "selected" : ""}>
                    ${escapeHtml(niceStatus(status))}
                  </option>
                `).join("")}
              </select>
            </label>

            <label>
              <span class="control-label">Payment status</span>
              <select id="payment-${escapeHtml(order.id)}">
                ${PAYMENT_STATUSES.map(status => `
                  <option value="${status}"
                    ${order.payment_status === status ? "selected" : ""}>
                    ${escapeHtml(niceStatus(status))}
                  </option>
                `).join("")}
              </select>
            </label>
          </div>

          <label>
            <span class="control-label" style="margin-top:14px">
              Admin / vendor note
            </span>
            <textarea id="note-${escapeHtml(order.id)}"
              maxlength="3000"
              placeholder="Add a note or update...">${escapeHtml(order.vendor_note || "")}</textarea>
          </label>

          <div class="actions">
            <button class="button"
              onclick="saveOrder('${escapeHtml(order.id)}')">
              SAVE ORDER UPDATE
            </button>

            <button class="button"
              onclick="copyOrderReference('${escapeHtml(order.order_number || "")}')">
              COPY REFERENCE
            </button>

            <button class="danger-button"
              onclick="deleteOrder('${escapeHtml(order.id)}', '${escapeHtml(order.order_number || "")}')">
              DELETE ORDER
            </button>
          </div>
        `;

        list.appendChild(card);
      });
    }

    async function saveOrder(orderId) {
      const status = document.getElementById(`status-${orderId}`).value;
      const paymentStatus =
        document.getElementById(`payment-${orderId}`).value;

      const note = document.getElementById(`note-${orderId}`)
        .value.trim();

      if (
        !ORDER_STATUSES.includes(status) ||
        !PAYMENT_STATUSES.includes(paymentStatus)
      ) {
        alert("Invalid status selected.");
        return;
      }

      const previous = cachedOrders.find(order => order.id === orderId);

      if (!previous) {
        alert("Order not found. Refresh the list.");
        return;
      }

      const now = new Date().toISOString();

      const { error } = await supabaseClient
        .from("brand_orders")
        .update({
          order_status: status,
          payment_status: paymentStatus,
          vendor_note: note,
          updated_at: now,
          ...(status !== previous.order_status &&
            [
              "confirmed",
              "not_received",
              "processing",
              "completed",
              "cancelled",
              "unconfirmed"
            ].includes(status)
              ? { vendor_response_at: now }
              : {})
        })
        .eq("id", orderId);

      if (error) {
        console.error("Order update failed:", error);
        alert("Could not update this order. Check your admin database policies.");
        return;
      }

      if (
        status !== previous.order_status ||
        paymentStatus !== previous.payment_status
      ) {
        const { error: eventError } = await supabaseClient
          .from("brand_order_events")
          .insert({
            order_id: orderId,
            previous_status: previous.order_status,
            new_status: status,
            payment_status: paymentStatus,
            actor_type: "admin",
            note: note || "Admin updated order"
          });

        if (eventError) {
          console.warn("Audit event could not be saved:", eventError.message);
        }
      }

      alert("Order updated successfully.");
      await loadBrandOrders();
    }

    async function deleteOrder(orderId, orderNumber) {
      const confirmed = confirm(
        `Are you sure you want to permanently delete ${orderNumber || "this order"}?\n\n` +
        "Its recorded items, event history and vendor access record will also be deleted.\n\n" +
        "This action cannot be undone."
      );

      if (!confirmed) return;

      const { data, error } = await supabaseClient
        .from("brand_orders")
        .delete()
        .eq("id", orderId)
        .select("id")
        .maybeSingle();

      if (error) {
        console.error("Order deletion failed:", error);
        alert(
          "Could not delete this order. Your admin account may need DELETE permission on brand_orders."
        );
        return;
      }

      if (!data) {
        alert(
          "The order was not deleted. Check that your admin account has permission to delete orders."
        );
        return;
      }

      cachedOrders = cachedOrders.filter(order => order.id !== orderId);

      updateOrderStats();
      renderBrandOrders();

      alert("Order deleted successfully.");
    }

    async function copyOrderReference(reference) {
      try {
        await navigator.clipboard.writeText(reference);
        alert("Reference copied.");
      } catch {
        alert("Copy failed. Reference: " + reference);
      }
    }

    async function adminLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = "account.html";
    }

    checkAdminAccess();
  </script>

</body>
</html>
